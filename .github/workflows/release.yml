name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FbinHttp ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            FbinHttp ${{ github.ref_name }} — 纯本地运行的 API 调试、压测与开发工具箱。

            ### 下载
            - macOS 11+（Apple Silicon / Intel 通用）：`FbinHttp_*_universal.dmg` + 一键安装脚本 `install-macos.sh`
            - Windows 10/11（x64）：`FbinHttp_*_x64-setup.exe`

            > macOS 的 dmg 是通用包，已内置 Intel（`x86_64`）与 Apple Silicon（`arm64`）两个切片，**Intel Mac 无需单独下载 Intel 版**。
            > 若出现「Apple 无法验证 FbinHttp.app 是否包含可能危害 Mac 安全或泄漏隐私的恶意软件」，这是系统对未公证应用的拦截，与芯片架构无关。

            ### macOS 安装（推荐一键脚本）
            脚本会自动校验本机架构、安装到「应用程序」、清除隔离属性、ad-hoc 重新签名并启动：

            ```bash
            curl -fLO https://github.com/Wayward-GOU/FbinHttp/releases/download/${{ github.ref_name }}/install-macos.sh
            bash install-macos.sh ${{ github.ref_name }}
            ```

            手动安装：把应用拖到「应用程序」后，打开「系统设置 → 隐私与安全性」，在「安全性」一栏点击「仍要打开」并输入密码（macOS 15 起右键「打开」不再能绕过该提示）；或在终端执行 `sudo xattr -dr com.apple.quarantine /Applications/FbinHttp.app`。

            ### Windows 安装
            双击安装，可选语言与安装目录，当前用户安装无需管理员权限；缺少 WebView2 时安装器会自动联网安装。

            > 安装包已做 ad-hoc 签名但未做 Apple 公证，SmartScreen / Gatekeeper 首次提示属正常现象。

            ### 本次更新（1.0.7）

            **请求页与环境**
            - 请求页右侧新增「环境变量」抽屉：不离开当前接口即可切换环境、增删变量、编辑环境脚本，保存后立即生效
            - 抽屉宽度随窗口自适应（最大 680px），变量表格与脚本编辑区放大，长脚本更好读
            - 环境选择跟随项目当前环境，从项目页进入接口时默认带出当前激活环境

            **项目页**
            - 记住上次打开的接口：返回项目页时自动展开所属集合、滚动并高亮该接口，名称后带「上次」标记
            - 接口或集合被删除后自动清理记忆，不会定位到已不存在的接口

            **错误提示**
            - 新增全局错误弹窗：发送请求、执行脚本、发起压测、批量运行等过程中出错统一弹出，展示错误摘要、发生阶段、接口、请求与环境，可一键复制完整错误信息
            - 同一错误在弹窗未关闭时不重复弹出，关闭后可再次触发
            - 脚本报错可直接定位：环境 / 前置 / 后置脚本出错时给出具体行号、列号与出错行上下文代码；`test()` 断言内部报错同样带定位；脚本语法错误给出明确提示
            - 请求页脚本错误区域改为多行等宽展示，长错误可滚动查看

            **界面**
            - 项目页顶部导入 / 导出入口收拢为两个下拉菜单：导入含 cURL、Postman / Apifox、OpenAPI / Swagger；导出含项目 JSON、OpenAPI 3.0；导入过程中显示 loading 并禁用重复触发
            - AI 功能入口统一使用四角星图标：AI 体检、AI 洞察、AI 分析、AI 生成计划、AI 分析结果、AI 解读；小HI 助手保留机器人形象

            ### 主要功能
            - 项目 / 集合 / 接口管理：cURL、Postman / Apifox、OpenAPI 导入，项目 JSON / OpenAPI 导出，接口全局搜索
            - HTTP 调试：Params / Headers / Body、环境变量与环境脚本、前置 / 后置脚本、断言测试、代码片段；JSON Body 支持注释与语法着色；请求页右侧直接管理环境，项目页记住上次打开的接口
            - 小HI（AI 助手）：39 个可调用工具，可建项目与接口、真实发送请求、写脚本、批量运行、发起压测、查历史与报告；附用量统计
            - 批量运行：多接口按迭代次数或 CSV 每行参数化执行，环境变量、前置 / 后置脚本与断言全部生效，单次上限 5000 个请求
            - 本地压测：固定并发与阶梯加压、RPS 限速、SLA 验收、逐请求明细与 JSON / HTML / Excel 报告导出
            - 数据大屏与请求历史：近 14 天趋势、状态码 / 方法 / 耗时分布、项目与接口 Top 5、压测 P95 走势；历史保留 10 万条
            - 脚本加密：AES / DES / 3DES 加解密、MD5 / SHA / HMAC 摘要、RSA 公钥加密，满足签名与密文入参场景
            - 系统监控、开发工具箱（9 大类 75 个工具）、自动更新、单实例与窗口状态记忆

      - name: Attach macOS installer script
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/install-macos.sh
          gh release upload "${{ github.ref_name }}" scripts/install-macos.sh --clobber

      - name: Verify macOS universal binary
        if: matrix.platform == 'macos-latest'
        run: |
          echo "== 定位构建产物 =="
          find src-tauri/target -maxdepth 5 -type d -name bundle -print 2>/dev/null || true

          APP="$(find src-tauri/target -maxdepth 6 -type d -name '*.app' -print 2>/dev/null | head -1)"
          DMG="$(find src-tauri/target -maxdepth 7 -type f -name '*.dmg' -print 2>/dev/null | head -1)"
          echo "app=$APP"
          echo "dmg=$DMG"

          MOUNT=""
          cleanup() {
            if [ -n "$MOUNT" ]; then
              hdiutil detach "$MOUNT" -quiet || true
            fi
          }
          trap cleanup EXIT

          # tauri-action 的产物目录随版本变化，找不到 .app 时直接从 dmg 中取应用校验
          if [ -z "$APP" ] && [ -n "$DMG" ]; then
            MOUNT="$(mktemp -d)"
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
            APP="$(find "$MOUNT" -maxdepth 2 -type d -name '*.app' -print | head -1)"
            echo "从 dmg 挂载取到 app=$APP"
          fi

          if [ -z "$APP" ]; then
            echo "未找到 .app 或可用的 .dmg 产物"
            find src-tauri/target -maxdepth 4 -type d -name 'bundle' -exec ls -R {} \; 2>/dev/null | head -80
            exit 1
          fi

          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print 2>/dev/null | head -1)"
          test -f "$BIN" || { echo "未找到可执行文件"; exit 1; }

          echo "== 可执行文件架构 =="
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs: $ARCHS"
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "缺少 Intel (x86_64) 切片，Intel Mac 将无法运行"; exit 1 ;;
          esac
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "缺少 Apple Silicon (arm64) 切片"; exit 1 ;;
          esac

          echo "== 签名信息 =="
          codesign -dv "$APP" 2>&1 || true
          codesign --verify --deep --strict "$APP" || { echo "ad-hoc 签名校验失败"; exit 1; }

          echo "== dmg 产物 =="
          [ -n "$DMG" ] && ls -lh "$DMG"


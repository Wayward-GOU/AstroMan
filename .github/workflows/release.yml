name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FinkMeter ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            FinkMeter ${{ github.ref_name }} — 纯本地运行的 API 调试、压测与开发工具箱。

            ### 下载
            - Windows 10/11（x64）：`FinkMeter_*_x64-setup.exe`
            - macOS 11+（Apple Silicon / Intel 通用包）：`FinkMeter_*_universal.dmg`，或使用下方的一键安装脚本

            ### 安装说明
            - Windows：双击安装，可选语言与安装目录，当前用户安装无需管理员权限；缺少 WebView2 时安装器会自动联网安装
            - macOS 一键安装（自动安装到「应用程序」并移除 Gatekeeper 隔离属性）：

            ```bash
            curl -fLO https://github.com/Wayward-GOU/FinkMeter/releases/download/${{ github.ref_name }}/install-macos.sh
            bash install-macos.sh ${{ github.ref_name }}
            ```

            - macOS 手动安装：把应用拖到「应用程序」。若提示「Apple 无法验证 FinkMeter.app」，打开「系统设置 → 隐私与安全性」，在「安全性」一栏点击「仍要打开」，再输入密码确认。macOS 15 起右键「打开」不再能绕过该提示。
            - 也可在终端手动放行（Intel / Apple Silicon 通用）：
              `sudo xattr -dr com.apple.quarantine /Applications/FinkMeter.app`
            - 安装包已做 ad-hoc 签名但未做 Apple 公证，SmartScreen / Gatekeeper 首次提示属正常现象

            ### 本次更新
            - 示例项目新增 6 个场景集合、约 30 个接口，覆盖各请求方法、认证方式、Body 类型、变量脚本、状态码与压测；旧数据库启动时自动补齐，不覆盖已有修改
            - 内置变量扩容：时间类（timestamp / isoTime / datetime / yyyyMMdd 等）与随机类（uuid / randomInt / randomFloat / randomString / randomEmail / randomPhone / randomIPv4 等），兼容 `{{$timestamp}}` 写法
            - 新增环境脚本：每个环境可写一段请求前执行的脚本，用 `vars.set()` 生成运行时变量；变量优先级为运行时变量 > 环境变量 > 内置变量
            - 新增代码片段：一键查看并复制 cURL / HTTP 原始报文 / JavaScript fetch / Python requests，环境变量按当前环境替换
            - 新增请求历史页：最近 500 条发送记录，支持搜索、失败数与平均耗时统计，点击可回到原接口
            - 新增自动更新：启动静默检查 GitHub Release，可一键下载对应平台安装包，设置页支持开关与手动检查
            - 工具箱新增「文本一键处理」（SQL IN 自动加单引号、去重排序、表格转 Markdown/HTML、MyBatis 日志提取 SQL 等）与「二维码生成 / 识别」，共 9 大类 75 个工具
            - 修复 macOS 安装问题：ad-hoc 签名避免被判定为「已损坏」，通用包同时包含 Intel 与 Apple Silicon 切片并在 CI 校验，安装脚本增加架构检查与 Gatekeeper 放行指引
            - 修复项目导入导出遗漏环境脚本、旧库缺少脚本字段等问题

            ### 主要功能
            - 项目 / 集合 / 接口管理与 cURL 导入、项目导入导出、接口全局搜索
            - HTTP 调试：Params / Headers / Body、环境变量与环境脚本、前置与后置脚本、断言测试、代码片段
            - 本地压测：固定并发与阶梯加压、RPS 限速、SLA 验收、逐请求明细与 JSON / HTML / Excel 报告导出
            - 请求历史、自动更新、系统监控与开发工具箱（9 大类 75 个工具）

      - name: Attach macOS installer script
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/install-macos.sh
          gh release upload "${{ github.ref_name }}" scripts/install-macos.sh --clobber

      - name: Verify macOS universal binary
        if: matrix.platform == 'macos-latest'
        run: |
          echo "== 定位构建产物 =="
          find src-tauri/target -maxdepth 5 -type d -name bundle -print 2>/dev/null || true

          APP="$(find src-tauri/target -maxdepth 6 -type d -name '*.app' -print 2>/dev/null | head -1)"
          DMG="$(find src-tauri/target -maxdepth 7 -type f -name '*.dmg' -print 2>/dev/null | head -1)"
          echo "app=$APP"
          echo "dmg=$DMG"

          MOUNT=""
          cleanup() {
            if [ -n "$MOUNT" ]; then
              hdiutil detach "$MOUNT" -quiet || true
            fi
          }
          trap cleanup EXIT

          # tauri-action 的产物目录随版本变化，找不到 .app 时直接从 dmg 中取应用校验
          if [ -z "$APP" ] && [ -n "$DMG" ]; then
            MOUNT="$(mktemp -d)"
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
            APP="$(find "$MOUNT" -maxdepth 2 -type d -name '*.app' -print | head -1)"
            echo "从 dmg 挂载取到 app=$APP"
          fi

          if [ -z "$APP" ]; then
            echo "未找到 .app 或可用的 .dmg 产物"
            find src-tauri/target -maxdepth 4 -type d -name 'bundle' -exec ls -R {} \; 2>/dev/null | head -80
            exit 1
          fi

          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print 2>/dev/null | head -1)"
          test -f "$BIN" || { echo "未找到可执行文件"; exit 1; }

          echo "== 可执行文件架构 =="
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs: $ARCHS"
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "缺少 Intel (x86_64) 切片，Intel Mac 将无法运行"; exit 1 ;;
          esac
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "缺少 Apple Silicon (arm64) 切片"; exit 1 ;;
          esac

          echo "== 签名信息 =="
          codesign -dv "$APP" 2>&1 || true
          codesign --verify --deep --strict "$APP" || { echo "ad-hoc 签名校验失败"; exit 1; }

          echo "== dmg 产物 =="
          [ -n "$DMG" ] && ls -lh "$DMG"


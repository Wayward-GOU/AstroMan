name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.platform }} ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
            target: ''
            cli: x86_64-pc-windows-msvc
          - platform: windows-latest
            args: '--target i686-pc-windows-msvc --bundles nsis'
            target: i686-pc-windows-msvc
            cli: i686-pc-windows-msvc
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
            target: ''
            cli: universal-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Add Windows 32-bit target
        if: matrix.target == 'i686-pc-windows-msvc'
        run: rustup target add i686-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      # W4 / A-21：发版前拦截 DevTools 与 CSP 回退
      - name: release 安全断言
        run: npm run security:check

      # W4 / A-22：随包归档 CycloneDX SBOM（按目标架构各存一份）
      - name: 生成 SBOM
        run: npm run sbom
      - name: 上传 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.cli }}
          path: dist/sbom.cdx.json

      # Tauri externalBin 要求 binaries/astroman-cli-<triple> 先存在
      - name: Prepare CLI binary
        run: node scripts/prepare-cli.mjs --target ${{ matrix.cli }}

      # universal 构建不会合并 sidecar，先确认 fat binary 与 bundler 取文件的路径都就位
      - name: Verify macOS universal CLI
        if: matrix.platform == 'macos-latest'
        run: |
          archs=$(lipo -archs src-tauri/binaries/astroman-cli-universal-apple-darwin)
          echo "universal CLI archs: $archs"
          case "$archs" in *arm64*) ;; *) echo "::error::universal CLI 缺少 arm64 切片"; exit 1 ;; esac
          case "$archs" in *x86_64*) ;; *) echo "::error::universal CLI 缺少 x86_64 切片"; exit 1 ;; esac
          test -x src-tauri/target/universal-apple-darwin/release/astroman-cli \
            || { echo "::error::sidecar 未预置到 target/universal-apple-darwin/release/"; exit 1; }
          lipo -archs src-tauri/target/universal-apple-darwin/release/astroman-cli

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # W4 / A-20：配置 Apple Developer ID 后由 Tauri 直接签名并公证；未配置时保持 ad-hoc
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AstroMan ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |            AstroMan ${{ github.ref_name }} — 纯本地运行的 API 调试、抓包、压测、记事本与开发工具箱。

            ### 下载
            - macOS 10.15+（Apple Silicon / Intel 通用）：`AstroMan_*_universal.dmg` + 一键安装脚本 `install-macos.sh`
            - Windows 10/11（x64）：`AstroMan_*_x64-setup.exe`（约 5MB，缺 WebView2 时联网补齐）
            - Windows 离线安装（断网 / 内网）：`AstroMan_*_x64-offline-setup.exe` / `AstroMan_*_x86-offline-setup.exe`（约 211MB，内置 WebView2）
            - Windows 10（32 位 x86）：`AstroMan_*_x86-setup.exe`
            - Windows 便携版（无需安装）：`AstroMan_*_x64-portable.zip` / `AstroMan_*_x86-portable.zip`，解压双击 `astroman.exe` 即用；安装器报错时优先用这个

            > 系统要求：Windows 10 1809+ / Windows 11（ARM64 可直接运行 x64 包）；macOS 10.15+。Windows 7 / 8 / 8.1 与 macOS 10.14 及更早系统无法运行。
            > 标准安装包约 5MB，缺 WebView2 时安装过程联网补齐；断网、内网、LTSC / Server 机器请用带 offline 的安装包。
            > macOS dmg 是通用包，已内置 Intel（`x86_64`）与 Apple Silicon（`arm64`）两个切片，**Intel Mac 无需单独下载 Intel 版**。
            > 若出现「Apple 无法验证 AstroMan.app 是否包含可能危害 Mac 安全或泄漏隐私的恶意软件」，这是系统对未公证应用的拦截，与芯片架构无关。
            > 若提示「AstroMan 已损坏，无法打开，你应该将它移到废纸篓」，是浏览器下载带来的隔离属性问题，不要点「移到废纸篓」，在终端执行 `sudo xattr -dr com.apple.quarantine /Applications/AstroMan.app` 后重新打开即可。

            ### macOS 安装（推荐一键脚本）
            脚本会自动校验本机架构、安装到「应用程序」、清除隔离属性、ad-hoc 重新签名并启动：

            ```bash
            curl -fLO https://github.com/Wayward-GOU/AstroMan/releases/download/${{ github.ref_name }}/install-macos.sh
            bash install-macos.sh ${{ github.ref_name }}
            ```

            手动安装：把应用拖到「应用程序」后，打开「系统设置 → 隐私与安全性」，在「安全性」一栏点击「仍要打开」并输入密码（macOS 15 起右键「打开」不再能绕过该提示）；或在终端执行 `sudo xattr -dr com.apple.quarantine /Applications/AstroMan.app`。

            ### Windows 安装
            双击安装，可选语言与安装目录，当前用户安装无需管理员权限；标准包在缺 WebView2 时自动联网补齐，离线包无需联网。

            > 安装包已做 ad-hoc 签名但未做 Apple 公证，SmartScreen / Gatekeeper 首次提示属正常现象。

            ### 本次更新（1.1.0）

            **界面：「深空钛」视觉重设计**
            - 设计令牌统一：23 套主题各维护 13 个基色，其余 25 个语义色自动派生；20 个视图统一 2/3px 圆角、28px 紧凑行高、等宽数字与发丝描边，去掉装饰投影与渐变，选中态统一为左侧主色线
            - 新增「宣纸」与「夜航舱」两套主题，共 23 套；亮色主题的侧栏统一改为深色锚点；设置页主题预览改为迷你卡片，23 套差异一眼可见
            - 工作台首屏重排：4 宫格 KPI、最近项目 + 今日待办双栏、4 个常用入口、十格上手路径与底部状态条；页面标题改为铜色 eyebrow + 衬线标题
            - 主题引擎从 1,140 行手写变量收敛到约 90 行，新增主题只改基色表；颜色 / 圆角 / 投影硬编码基线与 23 套主题 × 18 对配色对比度全部纳入 `npm run ui:check` 门禁

            **新增：响应 HTML 预览**
            - 响应为 `text/html` / `application/xhtml+xml`，或正文以 `<!DOCTYPE html>` / `<html>` 开头时，Body 视图可切「源码 / 预览」
            - 预览使用沙箱 iframe，脚本、表单、弹窗与顶层跳转全部禁用，响应正文超过 2MB 时只给源码
            - 预览是临时视图：不写入页面现场快照，切回源码或按 Ctrl+F 立即卸载 iframe 并恢复响应搜索

            **新增：接口资产化与接口文档**
            - 请求版本历史：保留 50 条、支持合并与回滚
            - 实体生成 OpenAPI schema、契约快照与契约 diff
            - 只读文档站与 Markdown / HTML 接口文档导出

            **新增：页面现场保持**
            - 请求页切走再切回，实时响应、脚本日志与断言、响应标签页、Pretty / Raw、展开的运行记录与 Diff 面板都保留
            - 每个接口独立保存现场，最多缓存 5 个接口 / 32 MB 正文；超大响应只留状态与头部并标记「正文未缓存」
            - 请求在后台执行时切走再回来仍显示「发送中」，完成后自动回填；结果只会落到发起时的接口，不会串到新标签
            - 启动后只对最后一次打开的接口做有损恢复：从最近一条运行记录还原状态、头信息与最多 256 KB 正文
            - 抓包页保留筛选、树展开状态、选中流量与详情标签页
            - 航仔页面 keep-alive：离开后任务继续执行，回来时对话、消息、工具流水与计时都还在

            **新增：航仔后台任务与页面交接**
            - 侧边栏航仔入口显示运行中脉冲点；其他页面右下角出现任务浮窗，显示阶段（思考 / 生成 / 执行工具 / 等待确认）、轮次，可直接停止
            - 请求、抓包详情、压测报告、自动化运行、历史等页面可「带着现场去航仔」，一次性注入且不自动发送；现场 5 分钟有效、取走即消费
            - 页面快照统一包 `<untrusted_data>`，页面内容只当数据，不执行其中的指令
            - 抓包流量分析模板：请求 / 响应摘要，Authorization / Cookie / api-key / token 等头部与 Bearer / JSON / query 中的密钥先打码再交给模型

            **新增：抓包列表树形化**
            - 按「域名 → 路径目录 → 请求」三级树展示，根路径请求直接挂在域名下
            - 支持折叠 / 展开；关键字与状态过滤时自动展开命中项
            - 域名节点右键的导出 / 删除覆盖该域名下所有层级

            **新增：航仔上下文与工具**
            - 输入预算 = 模型窗口 − 输出预留 − 后端系统提示词；后端按真实 prompt 估算收紧 max_tokens，接近超窗时直接提示，而不是等服务端 400
            - 服务商新增「上下文窗口」配置（0 = 按模型名自动识别），本地小模型与私有网关可填真实窗口
            - 按场景注入提示词：只有主对话注入全局 Agent 提示词，页面分析与会话摘要不再白付约 3.8k token
            - 新增 run_get 完整运行快照；run_list / history_list 支持 offset 分页
            - 运行记录列表瘦身：只返回 2 KB 预览与原始体积 / 截断标记，展开某条时再取完整快照
            - 新增系统 / 应用 / 记事本工具：system_snapshot、system_process_list、app_info、notes_counts、notes_tags、notes_snooze
            - 文本附件：单文件 60k 字符、合计 200k 字符双上限，超限提示并截断；支持拖拽文件，输入框展示附件合计 token 估算

            **新增：大文本编辑与响应查看优化**
            - 代码区超过阈值自动关闭着色 / 改用虚拟行号，大文本停止输入后再延迟着色，避免每次按键重算整段 HTML
            - 修复横向滚动条出现时着色层与行号错位（「文字比光标高一行」、点选位置与行号不对齐）
            - JSON 格式化移入 Web Worker，大 Body 格式化不再卡住界面
            - 请求编辑自动保存防抖按 Body 体量自适应；新增 request_save_quick 只写库、不回传整份详情
            - 响应面板超大 Body 不再自动 Pretty；运行详情按需加载

            **问题修复**
            - 修复压测报告详情页不跟系统主题、始终固定深色的问题：报告页改为跟随当前主题，卡片、表格、图表与状态色全部读令牌
            - 修复深色主题下侧栏悬停后文字与图标接近黑色、看起来像「点上去变黑」的问题；折叠态同时补上图标放大与名称提示
            - 修复窄宽度下响应头指标与 Pretty / Raw 视图切换换行错位的问题
            - 修复设置页主题选中勾压在缩略图描边上的问题
            - 修复从接口页进航仔再返回后航仔任务中断、刚请求的数据变成历史的问题
            - 修复切换接口标签后旧的在途请求结果落到新标签、按钮状态错乱的问题
            - 修复大 Body 编辑 / 保存卡顿、响应面板一次 stringify 数 MB 卡死的问题
            - 修复大文本编辑器点选位置与行号不对齐、滚到底部文字与光标错位的问题
            - 修复运行记录列表把完整请求 / 响应正文一次性搬到前端导致卡顿的问题
            - 修复写工具超时后模型自动重试、可能在后台重复执行的问题：超时统一标记「结果未知」，同工具同参数锁定，先让用户核对
            - 修复工具流水与用量预览把 API Key / Token / Cookie 明文落库的问题：后端与前端同口径脱敏，且先脱敏再截断

            **升级说明**
            - 数据库自动增量迁移到 schema v14（1.0.9 为 v6）：新增版本历史 / 契约 / 审计 / 协议与 AI 治理等表与列，只补表补列、不重建，老数据保留，无需手动操作
            - 默认主题变为「宣纸」，亮色主题的侧栏统一改为深色，首次升级视觉变化较大，功能与数据不受影响
            - 已有服务商的上下文窗口默认 0（按模型名自动识别），需要精确控制时在服务商编辑里填写

            ### 主要功能
            - 项目 / 集合 / 接口管理：cURL、Postman / Apifox、OpenAPI、HAR 导入，项目 JSON / OpenAPI 导出，接口全局搜索
            - HTTP 调试：Params / Headers / Body、环境变量与环境脚本、前置 / 后置脚本、断言测试、代码片段；JSON Body 支持注释与语法着色；请求页右侧直接管理环境，项目页记住上次打开的接口
            - 抓包分析：本机 MITM 代理、HTTPS 解密与根证书、系统代理接管、手机同 Wi-Fi 抓包、域名分组、HAR / ZIP 导出、改参重发、断点改包、Map Local / Map Remote、弱网模拟
            - 记事本与待办：四种类型、自然语言快速记录、多标签、应用内提醒与稍后提醒、截图生成待办、图片附件、托盘与全局快捷键
            - 航仔（AI 助手）：99 个工具（86 业务 + 12 工具箱 + tool_search，含 22 个测试域与 7 个抓包域），可建项目与接口、真实发送请求、写脚本、批量运行、发起压测、抓包查询 / 重发 / 导出、查历史与报告；支持停止、重试、上下文预算与摘要、确认卡、复盘时间线、会话管理、跨页面后台任务与页面现场交接
            - 自动化测试：套件 / 用例 / 数据集、Python 钩子、声明式断言、压测用例 SLA 与基线门禁、HTML / JSON / JUnit 报告、套件包导入导出与 CLI
            - 批量运行：多接口按迭代次数或 CSV 每行参数化执行，环境变量、前置 / 后置脚本与断言全部生效，单次上限 5000 个请求
            - 本地压测：固定并发与阶梯加压、RPS 限速、SLA 验收、逐请求明细与 JSON / HTML / Excel 报告导出
            - 数据大屏与请求历史：近 14 天趋势、状态码 / 方法 / 耗时分布、项目与接口 Top 5、压测 P95 走势；历史保留 10 万条
            - 脚本加密：AES / DES / 3DES 加解密、MD5 / SHA / HMAC 摘要、RSA 公钥加密，满足签名与密文入参场景
            - 系统监控、离线工具箱（9 大类 92 个工具）、自动更新、单实例与窗口状态记忆

      # W4 / A-20：配置证书后对标准安装包做 Authenticode 签名，并用签名版本替换 Release 资产
      - name: 签名标准安装包（可选）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host '未配置 WINDOWS_CERT_PFX_BASE64，跳过 Authenticode 签名'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'astroman-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $env:WINDOWS_CERT_PFX = $pfx
          $files = Get-ChildItem -Path src-tauri/target -Recurse -Filter '*setup.exe' |
            Where-Object { $_.Name -notmatch 'offline' }
          if (-not $files) { throw '未找到待签名的标准安装包' }
          foreach ($file in $files) {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -Path $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "签名失败：$($file.Name)" }
            gh release upload "${{ github.ref_name }}" $file.FullName --clobber
            Remove-Item $file.FullName -Force
          }
          Remove-Item $pfx -Force

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $arch = if ('${{ matrix.target }}' -eq 'i686-pc-windows-msvc') { 'x86' } else { 'x64' }
          $exe = if ('${{ matrix.target }}' -eq 'i686-pc-windows-msvc') {
            'src-tauri/target/i686-pc-windows-msvc/release/astroman.exe'
          } else {
            'src-tauri/target/release/astroman.exe'
          }
          if (-not (Test-Path $exe)) { throw "portable exe not found: $exe" }
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'astroman-sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $env:WINDOWS_CERT_PFX = $pfx
            & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -Path $exe
            if ($LASTEXITCODE -ne 0) { throw '便携版 exe 签名失败' }
            Remove-Item $pfx -Force
          }
          $cli = "src-tauri/binaries/astroman-cli-${{ matrix.cli }}.exe"
          if (-not (Test-Path $cli)) { throw "portable cli not found: $cli" }
          Copy-Item $cli 'astroman-cli.exe' -Force
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          @"
          AstroMan $version $arch 便携版
          解压后双击 astroman.exe 即可使用，无需安装，数据仍保存在本机。
          命令行：astroman-cli.exe test run --suite <套件> --out ./artifacts
          运行需要 Microsoft Edge WebView2 运行时；Windows 10 1809+ / Windows 11 通常已自带。
          如果没有，请先安装系统中的 Microsoft Edge WebView2 Runtime，或改用 setup 安装包。
          "@ | Out-File -FilePath README.txt -Encoding utf8
          Compress-Archive -Path $exe, 'astroman-cli.exe', README.txt, 'src-tauri/resources' -DestinationPath "AstroMan_${version}_${arch}-portable.zip" -Force
          gh release upload "${{ github.ref_name }}" "AstroMan_${version}_${arch}-portable.zip" --clobber

      - name: Build Windows offline installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $target = '${{ matrix.target }}'
          $arch = if ($target -eq 'i686-pc-windows-msvc') { 'x86' } else { 'x64' }
          $outDir = if ($target -eq 'i686-pc-windows-msvc') {
            'src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis'
          } else {
            'src-tauri/target/release/bundle/nsis'
          }
          $targetArgs = if ($target -ne '') { @('--target', $target) } else { @() }
          npx tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json @targetArgs
          if ($LASTEXITCODE -ne 0) { throw "offline build failed" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem "$outDir/AstroMan_${version}_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "offline setup not found in $outDir" }
          $offline = "AstroMan_${version}_${arch}-offline-setup.exe"
          Move-Item $setup.FullName $offline -Force
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'astroman-sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $env:WINDOWS_CERT_PFX = $pfx
            & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -Path $offline
            if ($LASTEXITCODE -ne 0) { throw '离线安装包签名失败' }
            Remove-Item $pfx -Force
          }
          gh release upload "${{ github.ref_name }}" $offline --clobber

      - name: Attach macOS installer script
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/install-macos.sh
          gh release upload "${{ github.ref_name }}" scripts/install-macos.sh --clobber

      - name: Verify macOS universal binary
        if: matrix.platform == 'macos-latest'
        run: |
          echo "== 定位构建产物 =="
          find src-tauri/target -maxdepth 5 -type d -name bundle -print 2>/dev/null || true

          APP="$(find src-tauri/target -maxdepth 6 -type d -name '*.app' -print 2>/dev/null | head -1)"
          DMG="$(find src-tauri/target -maxdepth 7 -type f -name '*.dmg' -print 2>/dev/null | head -1)"
          echo "app=$APP"
          echo "dmg=$DMG"

          MOUNT=""
          cleanup() {
            if [ -n "$MOUNT" ]; then
              hdiutil detach "$MOUNT" -quiet || true
            fi
          }
          trap cleanup EXIT

          # tauri-action 的产物目录随版本变化，找不到 .app 时直接从 dmg 中取应用校验
          if [ -z "$APP" ] && [ -n "$DMG" ]; then
            MOUNT="$(mktemp -d)"
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
            APP="$(find "$MOUNT" -maxdepth 2 -type d -name '*.app' -print | head -1)"
            echo "从 dmg 挂载取到 app=$APP"
          fi

          if [ -z "$APP" ]; then
            echo "未找到 .app 或可用的 .dmg 产物"
            find src-tauri/target -maxdepth 4 -type d -name 'bundle' -exec ls -R {} \; 2>/dev/null | head -80
            exit 1
          fi

          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print 2>/dev/null | head -1)"
          test -f "$BIN" || { echo "未找到可执行文件"; exit 1; }

          echo "== 可执行文件架构 =="
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs: $ARCHS"
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "缺少 Intel (x86_64) 切片，Intel Mac 将无法运行"; exit 1 ;;
          esac
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "缺少 Apple Silicon (arm64) 切片"; exit 1 ;;
          esac

          echo "== 签名信息 =="
          codesign -dv "$APP" 2>&1 || true
          codesign --verify --deep --strict "$APP" || { echo "ad-hoc 签名校验失败"; exit 1; }

          echo "== dmg 产物 =="
          [ -n "$DMG" ] && ls -lh "$DMG"


      # 体积门禁：标准 NSIS 安装包（不含 offline 版）超过 25MB 即失败，避免无评估地引入大依赖
      - name: 安装包体积门禁（NSIS ≤ 25MB）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $limit = 25MB
          $files = Get-ChildItem -Path src-tauri/target -Recurse -Filter '*setup.exe' |
            Where-Object { $_.Name -notmatch 'offline' }
          if (-not $files) { throw '未找到 NSIS 安装包' }
          foreach ($file in $files) {
            $mb = [math]::Round($file.Length / 1MB, 2)
            Write-Host "$($file.Name): $mb MB"
            if ($file.Length -gt $limit) {
              throw "安装包超过 25MB：$($file.Name) = $mb MB"
            }
          }

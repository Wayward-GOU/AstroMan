name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FbinHttp ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            FbinHttp ${{ github.ref_name }} — 纯本地运行的 API 调试、压测与开发工具箱。

            ### 下载
            - macOS 11+（Apple Silicon / Intel 通用）：`FbinHttp_*_universal.dmg` + 一键安装脚本 `install-macos.sh`
            - Windows 10/11（x64）：`FbinHttp_*_x64-setup.exe`

            > macOS 的 dmg 是通用包，已内置 Intel（`x86_64`）与 Apple Silicon（`arm64`）两个切片，**Intel Mac 无需单独下载 Intel 版**。
            > 若出现「Apple 无法验证 FbinHttp.app 是否包含可能危害 Mac 安全或泄漏隐私的恶意软件」，这是系统对未公证应用的拦截，与芯片架构无关。

            ### macOS 安装（推荐一键脚本）
            脚本会自动校验本机架构、安装到「应用程序」、清除隔离属性、ad-hoc 重新签名并启动：

            ```bash
            curl -fLO https://github.com/Wayward-GOU/FbinHttp/releases/download/${{ github.ref_name }}/install-macos.sh
            bash install-macos.sh ${{ github.ref_name }}
            ```

            手动安装：把应用拖到「应用程序」后，打开「系统设置 → 隐私与安全性」，在「安全性」一栏点击「仍要打开」并输入密码（macOS 15 起右键「打开」不再能绕过该提示）；或在终端执行 `sudo xattr -dr com.apple.quarantine /Applications/FbinHttp.app`。

            ### Windows 安装
            双击安装，可选语言与安装目录，当前用户安装无需管理员权限；缺少 WebView2 时安装器会自动联网安装。

            > 安装包已做 ad-hoc 签名但未做 Apple 公证，SmartScreen / Gatekeeper 首次提示属正常现象。

            ### 本次更新（1.0.5）
            **品牌与数据迁移**
            - 全套品牌改名 FbinHttp：应用图标、安装器图标、macOS 图标、托盘图标全部重制，界面 Logo 使用新的 `logo.png`，去掉了源图四周的白边
            - 数据目录与数据库文件改名为 `FbinHttp` / `fbinhttp.db`；首次启动自动把旧 `FinkMeter` 目录的数据复制过来，目标已存在则不覆盖，原目录保留
            - 配置目录随 identifier 迁到 `com.fbinhttp.app`，启动时自动复制旧的 `storage.json`、`settings.json` 与窗口状态；裸可执行文件名改为 `fbinhttp.exe`

            **新增功能**
            - 新增「批量运行」页：多选接口、按迭代次数或 CSV 每行参数化（`{{列名}}`）批量发送，环境变量、前置 / 后置脚本与断言全部生效，单次上限 5000 个请求，结果可导出
            - 首页新增「数据大屏」：近 14 天请求趋势、状态码分布、请求方法分布、今日各时段请求量、响应耗时分布、项目调用量 Top 5、高频接口 Top 5、最近压测 P95 走势，共 8 张图表，数据全部来自本机请求历史与压测报告
            - 首页新增批量运行介绍与示例（CSV 参数化、断言失败示例、与压测的区别）
            - 主题从 4 套扩到 8 套：新增琥珀橙、青碧、玫瑰、暮色

            **体验与稳定性**
            - 请求历史保留上限从 20000 条提升到 100000 条
            - 设置页在最大化窗口下撑满宽度，主题卡片一行 4 个展示
            - 新增单实例限制：重复启动只唤出已有窗口，避免多个进程抢占同一个 SQLite 库
            - 新增窗口状态记忆：退出后恢复上次的位置、尺寸与最大化状态
            - 首页布局重排：数据大屏移到「最近请求」之前，信息密度更紧凑
            - 前端按 vendor 分包（`vue` / `antd`），入口 chunk 从 200KB+ 降到约 47KB，业务代码更新不再让整个组件库缓存失效

            **问题修复**
            - 修复启动即崩溃：`test_plans` 索引依赖 `updated_at`，而旧库没有该列，导致建索引失败并回退默认目录；索引改为在 `migrate()` 补列之后创建
            - 修复打开应用白屏：`App.vue` 中 `navs` 在 `watch` 之后声明触发 TDZ `ReferenceError`，setup 中断导致整页空白
            - 修复图标四周白边：先按真实圆角拟合 alpha 蒙版，再清理最外几像素的浅色描边，小尺寸下不再出现灰边
            - 修复未知路由直接白屏：统一重定向到首页
            - 修复未捕获异常导致界面静默失效：新增全局错误兜底，弹一次提示并写日志
            - 升级提示按平台区分文案，macOS 提示拖入「应用程序」，Windows 提示走安装向导

            ### 1.0.4 更新（RSA 公钥解析修复）
            - 修复脚本里使用 `rsa.publicEncrypt` 时报 `Failed to execute 'atob' on 'Window': The string to be decoded is not correctly encoded`
            - 公钥解析自动容错：剥除 PEM 头尾、换行、空格、引号与字面量 `\n`，兼容 URL-safe Base64 和缺少尾部 `=` 的写法，复制粘贴即可用
            - 非法公钥不再抛浏览器原生英文错误，改为可读提示：公钥为空 / 含非 Base64 字符 / Base64 长度不合法

            ### 1.0.3 更新（脚本加密与上手引导）
            - 新增脚本加密能力：前置 / 环境 / 后置脚本均可使用 `cipher` 与 `rsa`
              - `cipher.aes / des / tripleDes`：CBC / ECB / CFB / OFB / CTR，PKCS7 / Zero / None 填充，支持 hex、Base64 格式的密钥与 IV
              - `cipher.md5 / sha1 / sha256`、`cipher.hmacSha1 / hmacSha256`、`cipher.base64 / hex` 编解码
              - `rsa.publicEncrypt`：RSA PKCS#1 v1.5 + Base64，与 Java `RSAUtils.publicEncrypt`（默认 `Cipher.getInstance("RSA")`）结果一致
              - 密钥长度（AES 16/24/32、DES 8、3DES 24 字节）与 IV 长度不合法时直接报错，避免静默生成错误密文
            - 脚本页新增「插入示例」：前置脚本提供时间戳 / nonce、MD5 签名、HMAC-SHA256、AES 加密请求体、RSA 加密字段、改写请求等 6 个示例；后置脚本提供断言、提取 Token、耗时断言、AES 解密响应等 4 个示例，选中即插入，不覆盖已有代码
            - 工作台「使用说明」扩充：引导从 4 步增至 7 步（新增签名加密、导入接口、数据备份），新增「常用操作」9 张速查卡（含可直接复制的签名 / 加密代码），常见问题从 7 条增至 13 条（密钥长度、cURL 导入、项目分享、变量排查、报告导出等）
            - 文档补充「新手上手」五步流程和「脚本与加密示例」章节，说明变量优先级与加密填充、密钥格式约定

            ### 主要功能
            - 项目 / 集合 / 接口管理与 cURL 导入、项目导入导出、接口全局搜索
            - HTTP 调试：Params / Headers / Body、环境变量与环境脚本、前置与后置脚本、断言测试、代码片段
            - 脚本加密：AES / DES / 3DES 加解密、MD5 / SHA / HMAC 摘要、RSA 公钥加密，满足签名与密文入参场景
            - 本地压测：固定并发与阶梯加压、RPS 限速、SLA 验收、逐请求明细与 JSON / HTML / Excel 报告导出
            - 请求历史、自动更新、系统监控与开发工具箱（9 大类 75 个工具）

      - name: Attach macOS installer script
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/install-macos.sh
          gh release upload "${{ github.ref_name }}" scripts/install-macos.sh --clobber

      - name: Verify macOS universal binary
        if: matrix.platform == 'macos-latest'
        run: |
          echo "== 定位构建产物 =="
          find src-tauri/target -maxdepth 5 -type d -name bundle -print 2>/dev/null || true

          APP="$(find src-tauri/target -maxdepth 6 -type d -name '*.app' -print 2>/dev/null | head -1)"
          DMG="$(find src-tauri/target -maxdepth 7 -type f -name '*.dmg' -print 2>/dev/null | head -1)"
          echo "app=$APP"
          echo "dmg=$DMG"

          MOUNT=""
          cleanup() {
            if [ -n "$MOUNT" ]; then
              hdiutil detach "$MOUNT" -quiet || true
            fi
          }
          trap cleanup EXIT

          # tauri-action 的产物目录随版本变化，找不到 .app 时直接从 dmg 中取应用校验
          if [ -z "$APP" ] && [ -n "$DMG" ]; then
            MOUNT="$(mktemp -d)"
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
            APP="$(find "$MOUNT" -maxdepth 2 -type d -name '*.app' -print | head -1)"
            echo "从 dmg 挂载取到 app=$APP"
          fi

          if [ -z "$APP" ]; then
            echo "未找到 .app 或可用的 .dmg 产物"
            find src-tauri/target -maxdepth 4 -type d -name 'bundle' -exec ls -R {} \; 2>/dev/null | head -80
            exit 1
          fi

          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print 2>/dev/null | head -1)"
          test -f "$BIN" || { echo "未找到可执行文件"; exit 1; }

          echo "== 可执行文件架构 =="
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs: $ARCHS"
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "缺少 Intel (x86_64) 切片，Intel Mac 将无法运行"; exit 1 ;;
          esac
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "缺少 Apple Silicon (arm64) 切片"; exit 1 ;;
          esac

          echo "== 签名信息 =="
          codesign -dv "$APP" 2>&1 || true
          codesign --verify --deep --strict "$APP" || { echo "ad-hoc 签名校验失败"; exit 1; }

          echo "== dmg 产物 =="
          [ -n "$DMG" ] && ls -lh "$DMG"


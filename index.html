<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>AstroMan</title>
    <style>
      /* 首屏骨架：Vue 挂载前就能看到界面轮廓，避免白屏 */
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      body {
        background: #f5f6fa;
        font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      .boot-skeleton {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #6b7490;
        font-size: 13px;
      }
      .boot-logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #4d6bfe, #8b5cf6);
        box-shadow: 0 6px 16px rgba(77, 107, 254, 0.25);
      }
      .boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #e6e9f2;
        border-top-color: #4d6bfe;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-skeleton" role="status" aria-label="AstroMan 正在启动">
        <span class="boot-logo" aria-hidden="true"></span>
        <span class="boot-spinner" aria-hidden="true"></span>
        <span>AstroMan 正在启动…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

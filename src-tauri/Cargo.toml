[package]
name = "astroman"
version = "1.1.1"
description = "AstroMan - 本地 API 调试与压测工具"
edition = "2021"
# 新增 astroman-cli 后仍让 `cargo run`（tauri dev 使用）默认启动桌面端
default-run = "astroman"

[lib]
name = "astroman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 基准专用：只暴露 bench_api，不改变默认构建
bench = []

# 基线基准需要 bench_api，`--all-targets` 下默认跳过
[[example]]
name = "baseline"
path = "examples/baseline.rs"
required-features = ["bench"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 仅为测试二进制补 Common-Controls v6 清单，见 build.rs
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["compression", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json", "stream", "native-tls", "gzip", "brotli", "deflate", "http2", "multipart", "socks"
] }
# 响应字符集：按 Content-Type 的 charset 解码 GBK/GB18030 等中文编码
encoding_rs = "0.8"
futures-util = "0.3"
# 实时调试 WebSocket（G-09）：native-tls 复用系统证书链
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
base64 = "0.22"
aes-gcm = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.36"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = [
  "time", "sync", "rt", "rt-multi-thread", "net", "io-util", "macros", "fs"
] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
regex = "1"
argon2 = "0.5"
# 仅用 tower 的 Layer/Service 抽象给 reqwest 加计时连接器（已在依赖树中，无新增体积）
tower = { version = "0.5", default-features = false }
# 抓包内核：0.25 才提供 should_intercept_tls（要求 Rust >= 1.86）
hudsucker = { version = "0.25", default-features = false, features = [
  "http2", "rcgen-ca", "rustls-client", "decoder"
] }
http-body-util = "0.1"
bytes = "1"
# 抓包上游代理（R6）：CONNECT 隧道 + absolute-form 复用 hudsucker 的 hyper/rustls 栈
hyper-http-proxy = "1"
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1", "http2", "webpki-tokio", "aws-lc-rs"
] }
# 抓包 ZIP 导出：只启用 deflate，避免带入 bzip2 / zstd 等未用压缩器
zip = { version = "9", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
mdns-sd = "0.22.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_Performance",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Networking_WinInet",
  "Win32_Security_Credentials"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dev-dependencies]
# 双机验收 harness：tauri::test 提供 noop_assets / mock 运行时，仅测试构建启用
tauri = { version = "2", features = ["test"] }
